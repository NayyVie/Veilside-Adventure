<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Form Penyewaan</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="css/profile.css" />

  <!-- Icon -->
  <link rel="icon" href="logo.png" />

  <style>
    body {
      background: #f8faf9;
      padding-top: 80px;
    }

    .form-container {
      max-width: 550px;
      margin: 60px auto;
      background: #fff;
      padding: 30px 40px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #136f63;
    }

    label {
      font-weight: 600;
      margin-top: 12px;
      display: block;
      color: #333;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 5px;
      font-size: 15px;
    }

    .qr-section {
      text-align: center;
      margin-top: 20px;
      display: none;
    }

    .qr-section img {
      width: 200px;
      margin: 10px 0;
      border-radius: 12px;
    }

    button {
      display: block;
      width: 100%;
      background: #136f63;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 25px;
      transition: 0.3s;
    }

    button:hover {
      background: #0b4d47;
    }

    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      background: #136f63;
      z-index: 9999;
      height: 75px;
      padding: 10px 0;
    }

    .nav-content {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 5px;
      color: white;
      text-decoration: none;
    }

    .logo img {
      width: 60px;
      height: auto;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>

<body>

  <!-- ================= NAVBAR ================= -->
  <header class="navbar">
    <div class="container nav-content">

      <!-- Logo -->
      <a href="index.html" class="logo">
        <img src="logo.png" alt="Logo Veilside Adventure" />
        <span>Veilside Adventure</span>
      </a>

      <!-- Menu -->
      <nav>
        <a href="index.html">Beranda</a>
        <a href="sewa.html">Produk</a>
        <a href="success.html">Riwayat</a>

        <!-- ===== PROFILE MENU ===== -->
        <div id="profileWrapper" class="profile-wrapper hidden">
          <img src="assets/profile.png" id="profileIcon" class="profile-icon">

          <div class="profile-dropdown">
            <p id="profileUsername">User</p>
            <hr>
            <button id="logoutBtn">Logout</button>
          </div>
        </div>
        <!-- ===== END PROFILE ===== -->

      </nav>
    </div>
  </header>
  <!-- ================= END NAVBAR ================= -->

  <!-- ================= MAIN ================= -->
  <main>
    <div class="form-container">
      <h2>Form Penyewaan</h2>

      <!-- Ringkasan keranjang -->
      <div id="cart-summary" style="margin-bottom: 20px"></div>

      <form id="rental-form">

        <label for="name">Nama Penyewa</label>
        <input type="text" id="name" placeholder="Masukkan nama Anda" required />

        <label for="wa">Nomor WhatsApp</label>
        <input type="text" id="wa" placeholder="08xxxxxxxxxx" required />

        <label for="start">Tanggal Sewa</label>
        <input type="date" id="start" required />

        <label for="days">Lama Sewa (hari)</label>
        <input type="number" id="days" min="1" value="1" required />

        <label for="payment">Metode Pembayaran</label>
        <select id="payment" required>
          <option value="">-- Pilih Metode --</option>
          <option value="cash">Cash</option>
          <option value="qris">QRIS</option>
        </select>

        <div class="qr-section" id="qr-section">
          <p>Scan kode QR berikut untuk pembayaran:</p>
          <img src="qriss.jpg" alt="QRIS" />
          <p><strong>QRIS</strong></p>
        </div>

        <button type="submit">Konfirmasi Pemesanan</button>
      </form>
    </div>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer style="text-align:center; padding:20px;">
    © 2025 Veilside Adventure
  </footer>

  <!-- ================= SCRIPT ================= -->
  <script src="sewa.js"></script>
  <script src="js/profile.js"></script>

</body>
</html>
