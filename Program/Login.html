<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Veilside Adventure</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #e8f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-box {
      background: white;
      padding: 30px;
      width: 350px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      text-align: center;
    }
    .login-box h2 {
      margin-bottom: 20px;
      color: #0c6452;
    }
    .login-box input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #aaa;
      font-size: 16px;
    }
    .login-btn {
      width: 100%;
      padding: 10px;
      background: #0c6452;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    .login-btn:hover {
      background: #0a5042;
    }
    .register-link {
      margin-top: 10px;
      display: block;
      color: #0c6452;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>

    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>

    <button class="login-btn" onclick="login()">Masuk</button>

    <a href="register.html" class="register-link">Belum punya akun? Daftar</a>
  </div>

  <script>
    // Membuat akun default (admin + user) jika belum ada
    if (!localStorage.getItem("accounts")) {
      const defaultUsers = [
        { username: "admin", password: "12345", role: "admin" },
        { username: "user", password: "12345", role: "user" }
      ];
      localStorage.setItem("accounts", JSON.stringify(defaultUsers));
    }

    function login() {
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value.trim();

      const accounts = JSON.parse(localStorage.getItem("accounts"));
      const found = accounts.find(acc => acc.username === user && acc.password === pass);

      if (!found) {
        alert("Username atau password salah!");
        return;
      }

      // Simpan session login
      sessionStorage.setItem("currentUser", JSON.stringify(found));

      // Arahkan berdasarkan role
      if (found.role === "admin") {
        window.location.href = "admin.html";
      } else {
        window.location.href = "index.html"; // halaman user
      }
    }
  </script>
</body>
</html>
