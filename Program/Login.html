<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Veilside Adventure</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #e8f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .login-box {
        background: white;
        padding: 30px;
        width: 350px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        text-align: center;
      }
      .login-box h2 {
        margin-bottom: 20px;
        color: #0c6452;
      }
      .login-box input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
        border: 1px solid #aaa;
        font-size: 16px;
      }
      .login-btn {
        width: 100%;
        padding: 10px;
        background: #0c6452;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
      }
      .login-btn:hover {
        background: #0a5042;
      }
      .register-link {
        margin-top: 10px;
        display: block;
        color: #0c6452;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h2>Login</h2>

      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />

      <button class="login-btn" onclick="login()">Masuk</button>

      <a href="register.html" class="register-link">Belum punya akun? Daftar</a>
    </div>

    <!-- JS LOGIN DI SINI -->
    <script>
      function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        // CONTOH DATA (SIMULASI DATABASE)
        const users = [
          { username: "admin", password: "admin123", role: "admin" },
          { username: "user", password: "user123", role: "user" },
        ];

        // CEK USER
        const foundUser = users.find(
          (u) => u.username === username && u.password === password
        );

        if (foundUser) {
          // 🔑 INI YANG KAMU TANYA
          sessionStorage.setItem("currentUser", JSON.stringify(foundUser));

          // ARAHIN SESUAI ROLE
          if (foundUser.role === "admin") {
            window.location.href = "admin.html";
          } else {
            window.location.href = "index.html";
          }
        } else {
          alert("Username atau password salah!");
        }
      }
    </script>
  </body>
</html>
